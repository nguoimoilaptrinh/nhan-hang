<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhận hàng">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>Nhận hàng 7net</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --text: #1f1e1c; --muted: #6b6a65; --faint: #9c9a93; --line: #e2e0d8;
  --fill: #185fa5; --on-fill: #ffffff; --chip-on: #e6f1fb; --chip-on-text: #0c447c;
  --ok: #3b6d11; --ok-bg: #eaf3de; --warn: #854f0b; --warn-bg: #faeeda; --bad: #a32d2d; --bad-bg: #fcebeb;
  --hl: rgba(239, 159, 39, .35);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1b; --card: #2a2a28; --text: #f1efe8; --muted: #b4b2a9; --faint: #85837c; --line: #3c3b38;
    --fill: #378add; --chip-on: #0c447c; --chip-on-text: #e6f1fb;
    --ok: #c0dd97; --ok-bg: #27500a; --warn: #fac775; --warn-bg: #633806; --bad: #f7c1c1; --bad-bg: #791f1f;
    --hl: rgba(239, 159, 39, .45);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
  -webkit-tap-highlight-color: transparent;
  padding: 0 max(12px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px, env(safe-area-inset-left));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px;
  border: 0; border-radius: 12px; background: var(--fill); color: var(--on-fill);
  font-size: 18px; font-weight: 600; text-decoration: none;
}
.link { background: none; border: 0; padding: 8px 4px; color: var(--fill); font-size: 15px; }

/* Màn hình khoá */
.lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.lock-card { width: 100%; max-width: 360px; text-align: center; }
.lock-card img { border-radius: 14px; }
.lock-card h1 { font-size: 22px; font-weight: 600; margin: 12px 0 20px; }
.lock-card input[type=password] {
  width: 100%; height: 54px; padding: 0 16px; font-size: 20px; text-align: center;
  border: 1px solid var(--line); border-radius: 12px; background: var(--card);
}
.remember { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0; color: var(--muted); font-size: 15px; }
.remember input { width: 20px; height: 20px; }
.msg { min-height: 22px; margin: 12px 0 0; color: var(--bad); font-size: 15px; }

#app { max-width: 640px; margin: 0 auto; }

/* Thanh trên cùng */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 10px) 0 8px; }
.stores { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 10px; }
.stores::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 15px; white-space: nowrap;
}
.chip b { font-weight: 600; margin-left: 4px; }
.chip.on { background: var(--chip-on); color: var(--chip-on-text); border-color: transparent; }
.search-row { display: flex; gap: 8px; }
.search { position: relative; flex: 1; min-width: 0; }
.scan-btn {
  flex: none; width: 56px; height: 56px; border: 0; border-radius: 14px;
  background: var(--fill); color: var(--on-fill); display: flex; align-items: center; justify-content: center;
}
.search input {
  width: 100%; height: 56px; padding: 0 52px 0 16px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--card);
  font-family: var(--mono); font-size: 24px; letter-spacing: 1px;
}
.search input:focus { outline: none; border-color: var(--fill); }
.search input::placeholder { font-family: -apple-system, sans-serif; font-size: 17px; letter-spacing: 0; color: var(--faint); }
.clear {
  position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: var(--line); color: var(--muted); font-size: 22px; line-height: 1;
}
.filters { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.seg { display: flex; flex: 1; background: var(--line); border-radius: 10px; padding: 2px; }
.seg button { flex: 1; min-height: 36px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; }
.filters select { max-width: 40%; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 8px; font-size: 14px; }

/* Danh sách */
.banner { margin: 4px 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.num { font-family: var(--mono); font-size: 24px; letter-spacing: .5px; white-space: nowrap; }
.num .pre { font-size: .6em; color: var(--faint); letter-spacing: 0; }
.num .gap { margin-left: .3em; }
.num .m { background: var(--hl); border-radius: 3px; }
.hit { background: var(--card); border: 2px solid var(--fill); border-radius: 16px; padding: 14px; margin: 6px 0 12px; }
.hit .num { font-size: 32px; margin: 6px 0 14px; }
.hit.is-done { border-color: var(--warn); }
.hit-meta { font-size: 14px; color: var(--muted); }
.hit.is-done .hit-meta { color: var(--warn); font-weight: 600; }
.list { background: var(--card); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; }
.meta { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.is-done .num, .row.is-done .meta { color: var(--faint); text-decoration: line-through; }
.row.is-done .num .m { background: none; }
.open-sm {
  flex: none; display: flex; align-items: center; justify-content: center; min-width: 52px; height: 40px; padding: 0 10px;
  border: 0; border-radius: 10px; background: var(--chip-on); color: var(--chip-on-text); font-size: 15px; font-weight: 600;
}
.check {
  flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line);
  background: none; color: var(--faint); font-size: 20px; line-height: 1;
}
.check.on { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.tag { display: inline-block; padding: 0 6px; border-radius: 6px; font-weight: 600; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty .chip { margin-top: 12px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 2px 24px; font-size: 13px; color: var(--muted); }
.toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 480px; margin: 0 auto; padding: 8px 8px 8px 16px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: 15px;
}
.toast .link { color: var(--bg); font-weight: 600; text-decoration: underline; }
.summary { margin: 2px 2px 8px; font-size: 14px; color: var(--muted); }
.summary b { color: var(--text); }
body.noscroll { overflow: hidden; }

/* Màn hình mã vạch */
.sheet {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px, env(safe-area-inset-left));
}
.sheet-card { max-width: 520px; margin: 0 auto; text-align: center; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; text-align: left; }
.sheet-warn { margin: 8px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 15px; }
.barcode { margin: 14px 0 10px; padding: 18px 0; background: #fff; border-radius: 12px; }
.barcode svg { display: block; margin: 0 auto; }
.barcode.size-sej svg { width: 245px; height: 56px; }  /* Đúng kích thước trên trang payment.sej.co.jp */
.barcode.size-medium svg { width: 300px; max-width: 100%; height: 90px; }
.barcode.size-large svg { width: 100%; height: 150px; }
.size-seg { max-width: 360px; margin: 0 auto 14px; }

/* Cài đặt */
.settings { text-align: left; }
.settings h2 { margin: 0; font-size: 20px; }
.settings h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
.hint { margin: 8px 0; font-size: 13px; color: var(--muted); }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.switch-row input { flex: none; width: 22px; height: 22px; }
.sheet-num { font-family: var(--mono); font-size: 30px; letter-spacing: 1px; }
.sheet-pay { margin: 10px 0 2px; font-size: 18px; }
.sheet-pay b { font-size: 26px; }
.sheet .meta { white-space: normal; margin-bottom: 18px; }
.sheet .link { display: inline-block; margin-top: 12px; }

/* Màn hình quét */
.scanner { position: fixed; inset: 0; z-index: 30; background: #000; color: #fff; display: flex; flex-direction: column; }
.scan-view { position: relative; flex: 1; min-height: 0; }
.scan-view video, .scan-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.scan-view video { object-fit: cover; }
.scan-view canvas { pointer-events: none; }
.scan-tools { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px; display: flex; gap: 8px; }
.scan-tools button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 14px; }
.scan-bar { padding: 12px 16px calc(env(safe-area-inset-bottom) + 14px); background: #000; text-align: center; }
.scan-msg { min-height: 40px; font-size: 15px; word-break: break-all; white-space: pre-line; }
.scan-log {
  margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: #1d1d1d; color: #f2b233;
  font-family: var(--mono); font-size: 13px; text-align: left; white-space: pre-line; word-break: break-all;
}
.scan-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.scan-actions button { min-height: 48px; padding: 0 20px; border: 1px solid #666; border-radius: 12px; background: #222; color: #fff; }
</style>
</head>
<body>

<main id="lock" class="lock" hidden>
  <div class="lock-card">
    <img src="icon.png" alt="" width="64" height="64">
    <h1>Nhận hàng 7net</h1>
    <form id="lockForm">
      <input type="text" name="username" value="7net" autocomplete="username" hidden>
      <input id="pin" type="password" name="password" autocomplete="current-password" placeholder="Nhập PIN" aria-label="PIN">
      <label class="remember"><input id="remember" type="checkbox" checked> Nhớ trên máy này</label>
      <button id="unlockBtn" type="submit" class="btn-primary">Mở khoá</button>
      <p id="lockMsg" class="msg" role="alert"></p>
    </form>
  </div>
</main>

<main id="app" hidden>
  <header class="top">
    <div id="stores" class="stores"></div>
    <div class="search-row">
      <div class="search">
        <input id="q" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="Gõ số trên thùng" aria-label="Tìm theo số trên thùng">
        <button id="clearQ" class="clear" aria-label="Xoá ô tìm" hidden>×</button>
      </div>
      <button id="scanBtn" class="scan-btn" aria-label="Quét mã vạch trên thùng">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M16 9v6"/>
        </svg>
      </button>
    </div>
    <div id="filters" class="filters">
      <div class="seg" id="seg">
        <button data-filter="todo" class="on">Chưa nhận</button><button data-filter="all">Tất cả</button><button data-filter="done">Đã nhận</button>
      </div>
      <select id="prod" aria-label="Lọc sản phẩm" hidden></select>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="summary" class="summary"></div>
  <div id="hit"></div>
  <div id="list" class="list"></div>
  <footer class="foot">
    <span id="updated"></span>
    <span><button id="settingsBtn" class="link">Cài đặt</button> · <button id="reloadBtn" class="link">Tải lại</button> · <button id="lockBtn" class="link">Khoá</button></span>
  </footer>
</main>

<div id="toast" class="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo" class="link">Hoàn tác</button></div>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetNum" hidden>
  <div class="sheet-card">
    <div class="sheet-top"><span>Đưa màn hình cho nhân viên quét</span><button id="sheetClose" class="link">Đóng</button></div>
    <div id="sheetDone" class="sheet-warn" hidden></div>
    <div id="barcode" class="barcode"></div>
    <div class="seg size-seg" aria-label="Cỡ mã vạch">
      <button data-size="sej">Như 7-Eleven</button><button data-size="medium">Vừa</button><button data-size="large">Lớn</button>
    </div>
    <div id="sheetNum" class="sheet-num"></div>
    <div class="sheet-pay">Thanh toán <b id="sheetAmount"></b></div>
    <div id="sheetMeta" class="meta"></div>
    <button id="sheetOk" class="btn-primary">Đã nhận · kiện tiếp theo</button>
    <a id="sheetLink" class="link" target="_blank" rel="noopener noreferrer">Mở trang 7-Eleven (dự phòng)</a>
  </div>
</div>

<div id="settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="sheet-card settings">
    <div class="sheet-top"><h2 id="settingsTitle">Cài đặt</h2><button id="settingsClose" class="link">Xong</button></div>
    <h3>Cỡ mã vạch</h3>
    <div class="seg"><button data-size="sej">Như 7-Eleven</button><button data-size="medium">Vừa</button><button data-size="large">Lớn</button></div>
    <p class="hint">"Như 7-Eleven" giống hệt kích thước trên trang payment.sej.co.jp (245 × 56). Máy quét khó đọc thì thử cỡ khác. Trên màn hình mã vạch cũng đổi được cỡ.</p>
    <div id="sizePreview" class="barcode"></div>
    <h3>Khi quét thùng bằng camera</h3>
    <label class="switch-row"><span>Kêu "bíp" khi khớp đơn</span><input id="optBeep" type="checkbox"></label>
    <label class="switch-row"><span>Bấm "Đã nhận" xong tự mở camera cho thùng tiếp theo</span><input id="optRescan" type="checkbox"></label>
  </div>
</div>

<div id="scanner" class="scanner" hidden>
  <div class="scan-view">
    <video id="scanVideo" playsinline muted autoplay></video>
    <canvas id="scanMarks"></canvas>
    <div class="scan-tools"><button id="torchBtn" hidden>Đèn: tắt</button><button id="zoomBtn" hidden>Phóng to</button></div>
  </div>
  <div class="scan-bar">
    <div id="scanMsg" class="scan-msg"></div>
    <div id="scanLog" class="scan-log" hidden></div>
    <div class="scan-actions"><button id="scanCopy" hidden>Sao chép mã chưa khớp</button><button id="scanClose">Đóng</button></div>
  </div>
</div>

<script>
'use strict';
const KEY = {
  key: '7net_key', salt: '7net_salt', blob: '7net_blob', done: '7net_done', store: '7net_store',
  scanlog: '7net_scanlog', settings: '7net_settings',
};
const DEFAULT_SETTINGS = { size: 'sej', beep: true, autoRescan: true };
const RELOAD_AFTER_MS = 10 * 60 * 1000;
const $ = id => document.getElementById(id);
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

let blob = null, cryptoKey = null, data = null, offline = false, lastFetch = 0;
let done = readDone();
const view = { store: storage.get(KEY.store) || '', filter: 'todo', prod: '' };

// ---------- Tiện ích ----------
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const digits = s => s.normalize('NFKC').replace(/\D/g, '');
const fmtTime = ms => { const d = new Date(ms); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };

function readDone() {
  try { return JSON.parse(storage.get(KEY.done) || '{}') || {}; } catch (e) { return {}; }
}
function saveDone() { storage.set(KEY.done, JSON.stringify(done)); }

// ---------- Tải & giải mã ----------
async function fetchBlob() {
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = JSON.parse(text);
    storage.set(KEY.blob, text);
    lastFetch = Date.now();
    return { blob: parsed, offline: false };
  } catch (err) {
    const cached = storage.get(KEY.blob);
    if (cached) return { blob: JSON.parse(cached), offline: true };
    throw err;
  }
}

async function deriveKey(pin, b) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(b.salt), iterations: b.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

async function decrypt(key, b) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(b.iv) }, key, b64d(b.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function savedKey(b) {
  const raw = storage.get(KEY.key);
  if (!raw || storage.get(KEY.salt) !== b.salt) return null;
  return crypto.subtle.importKey('raw', b64d(raw), 'AES-GCM', true, ['decrypt']);
}

async function start() {
  if (!window.crypto || !crypto.subtle) { showLock('Trình duyệt không hỗ trợ giải mã. Hãy mở bằng link https.'); return; }
  try {
    ({ blob, offline } = await fetchBlob());
  } catch (err) {
    showLock('Không tải được dữ liệu. Kiểm tra mạng rồi mở lại.'); return;
  }
  try {
    cryptoKey = cryptoKey || await savedKey(blob);
    if (cryptoKey) { data = await decrypt(cryptoKey, blob); showApp(); return; }
  } catch (err) {
    cryptoKey = null; storage.del(KEY.key);
  }
  showLock('');
}

async function reload(silent) {
  try {
    ({ blob, offline } = await fetchBlob());
  } catch (err) {
    if (!silent) toast('Không tải được dữ liệu, kiểm tra mạng');
    return;
  }
  try {
    data = await decrypt(cryptoKey, blob);
  } catch (err) {
    cryptoKey = null; storage.del(KEY.key);
    showLock('PIN đã đổi, hãy nhập lại.');
    return;
  }
  showApp();
  if (!silent) toast(offline ? 'Không có mạng, đang dùng bản đã lưu' : 'Đã tải dữ liệu mới');
}

// ---------- Màn hình ----------
function showLock(msg) {
  $('app').hidden = true; $('lock').hidden = false;
  $('lockMsg').textContent = msg || '';
}

function showApp() {
  $('lock').hidden = true; $('app').hidden = false;
  const live = new Set(data.orders.map(o => o.n));
  let changed = false;
  for (const n in done) if (!live.has(n)) { delete done[n]; changed = true; }
  if (changed) saveDone();
  buildAliasIndex();
  render();
}

$('lockForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const pin = $('pin').value.trim();
  if (!pin) { $('lockMsg').textContent = 'Nhập PIN trước đã'; return; }
  if (!blob) { await start(); if (!blob) return; }
  $('unlockBtn').textContent = 'Đang giải mã…';
  try {
    const key = await deriveKey(pin, blob);
    data = await decrypt(key, blob);
    cryptoKey = key;
    if ($('remember').checked) {
      storage.set(KEY.key, b64e(await crypto.subtle.exportKey('raw', key)));
      storage.set(KEY.salt, blob.salt);
    }
    $('pin').value = '';
    showApp();
  } catch (err) {
    $('lockMsg').textContent = 'PIN không đúng';
  } finally {
    $('unlockBtn').textContent = 'Mở khoá';
  }
});
$('pin').addEventListener('input', () => { $('lockMsg').textContent = ''; });

// ---------- Hiển thị ----------
function numHtml(n, q) {
  const at = q ? n.lastIndexOf(q) : -1;
  let html = '', cur = null, buf = '';
  for (let i = 0; i < n.length; i++) {
    const cls = [i < n.length - 7 ? 'pre' : '', i === n.length - 2 ? 'gap' : '', at >= 0 && i >= at && i < at + q.length ? 'm' : '']
      .filter(Boolean).join(' ');
    if (cls !== cur) { if (cur !== null) html += `<span class="${cur}">${buf}</span>`; cur = cls; buf = ''; }
    buf += n[i];
  }
  return html + `<span class="${cur}">${buf}</span>`;
}

function daysUntil(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date();
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}

function deadlineHtml(o) {
  if (!o.e) return o.er ? 'hạn ' + esc(o.er) : 'chưa rõ hạn';
  const days = daysUntil(o.e), md = o.e.slice(5).replace('-', '/');
  if (days < 0) return `<span class="tag bad">quá hạn ${md}</span>`;
  if (days === 0) return '<span class="tag bad">hết hạn hôm nay</span>';
  if (days === 1) return `<span class="tag warn">hạn ngày mai</span>`;
  return 'hạn ' + md;
}

function showBtn(o, big) {
  const label = big ? (done[o.n] ? 'Hiện lại mã vạch' : 'Hiện mã vạch') : 'Mã';
  return `<button class="${big ? 'btn-primary' : 'open-sm'}" data-show="${esc(o.n)}" aria-label="Hiện mã vạch">${label}</button>`;
}

function rowHtml(o, q) {
  const d = done[o.n];
  return `<div class="row${d ? ' is-done' : ''}">
    <div class="row-main">
      <div class="num">${numHtml(o.n, q)}</div>
      <div class="meta">${esc(o.ps)} · ${deadlineHtml(o)}${o.a ? ' · ¥' + o.a.toLocaleString('ja-JP') : ''}${d ? ' · nhận lúc ' + fmtTime(d) : ''}</div>
    </div>
    ${showBtn(o)}
    <button class="check${d ? ' on' : ''}" data-toggle="${esc(o.n)}" aria-label="${d ? 'Bỏ đánh dấu' : 'Đánh dấu đã nhận'}">✓</button>
  </div>`;
}

function hitHtml(o, q) {
  const d = done[o.n];
  return `<div class="hit${d ? ' is-done' : ''}">
    <div class="hit-meta">${d ? 'Kiện này đã đánh dấu nhận lúc ' + fmtTime(d) : 'Khớp 1 kiện'} · ${esc(o.ps)} · ${deadlineHtml(o)}</div>
    <div class="num">${numHtml(o.n, q)}</div>
    ${showBtn(o, true)}
  </div>`;
}

function storeStats() {
  const map = new Map();
  for (const o of data.orders) {
    if (!map.has(o.s)) map.set(o.s, { name: o.s, total: 0, left: 0 });
    const s = map.get(o.s);
    s.total++;
    if (!done[o.n]) s.left++;
  }
  return [...map.values()];
}

function render() {
  const stats = storeStats();
  if (!stats.some(s => s.name === view.store)) {
    view.store = stats.length ? [...stats].sort((a, b) => b.left - a.left)[0].name : '';
  }
  $('stores').innerHTML = stats.map(s =>
    `<button class="chip${s.name === view.store ? ' on' : ''}" data-store="${esc(s.name)}">${esc(s.name)}<b>${s.left}/${s.total}</b></button>`).join('');

  const inStore = data.orders.filter(o => o.s === view.store);
  const prods = [...new Set(inStore.map(o => o.ps))];
  if (!prods.includes(view.prod)) view.prod = '';
  $('prod').hidden = prods.length < 2;
  $('prod').innerHTML = '<option value="">Tất cả SP</option>' +
    prods.map(p => `<option value="${esc(p)}"${p === view.prod ? ' selected' : ''}>${esc(p)}</option>`).join('');

  const q = digits($('q').value);
  $('clearQ').hidden = !q;
  $('filters').hidden = !!q;

  let rows;
  if (q) {
    // Khi đang tìm: tìm trong cả cửa hàng, kiện chưa nhận lên trước, rồi tới kiện có đuôi khớp số vừa gõ
    rows = inStore.filter(o => o.n.includes(q))
      .sort((a, b) => (!!done[a.n] - !!done[b.n]) || (b.n.endsWith(q) - a.n.endsWith(q)));
  } else {
    rows = inStore
      .filter(o => !view.prod || o.ps === view.prod)
      .filter(o => view.filter === 'all' || (view.filter === 'done') === !!done[o.n]);
  }

  const scope = inStore.filter(o => !view.prod || o.ps === view.prod);
  const left = scope.filter(o => !done[o.n]);
  const due = left.reduce((sum, o) => sum + (o.a || 0), 0);
  $('summary').hidden = !!q;
  $('summary').innerHTML = `Còn <b>${left.length}/${scope.length}</b> kiện` + (due ? ` · cần trả <b>¥${due.toLocaleString('ja-JP')}</b>` : '');

  $('hit').innerHTML = q && rows.length === 1 ? hitHtml(rows[0], q) : '';
  $('list').innerHTML = rows.length ? rows.map(o => rowHtml(o, q)).join('') : emptyHtml(q);
  $('list').hidden = q && rows.length === 1;

  const notes = [];
  if (data.sample) notes.push('Đây là DỮ LIỆU MẪU để thử, không phải đơn thật. Chạy main.py sẽ thay bằng đơn thật.');
  if (offline) notes.push('Không tải được bản mới, đang dùng dữ liệu đã lưu.');
  $('banner').hidden = !notes.length;
  $('banner').textContent = notes.join(' ');
  $('updated').textContent = `Dữ liệu ${data.updated} · ${data.orders.length} đơn`;
}

function emptyHtml(q) {
  if (!q) return '<div class="empty">Không có kiện nào ở mục này</div>';
  const elsewhere = data.orders.filter(o => o.s !== view.store && o.n.includes(q));
  if (!elsewhere.length) return '<div class="empty">Không có kiện nào khớp số này</div>';
  const other = elsewhere[0].s;
  return `<div class="empty">Không có ở cửa hàng này, nhưng có ${elsewhere.length} kiện khớp ở
          <br><button class="chip" data-store="${esc(other)}">Chuyển sang ${esc(other)}</button></div>`;
}

// ---------- Thao tác ----------
let toastTimer = null, undoSlip = null;
function toast(text, slip) {
  $('toastText').textContent = text;
  $('toastUndo').hidden = !slip;
  undoSlip = slip || null;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; undoSlip = null; }, 6000);
}

$('toastUndo').addEventListener('click', () => {
  if (undoSlip) { delete done[undoSlip]; saveDone(); render(); }
  $('toast').hidden = true;
});

// ---------- Mã vạch NW-7 (Codabar) giống trang 払込票 của 7-Eleven: A + 13 số + A, vạch rộng = 3 vạch hẹp ----------
const NW7 = {
  '0': '0000011', '1': '0000110', '2': '0001001', '3': '1100000', '4': '0010010',
  '5': '1000010', '6': '0100001', '7': '0100100', '8': '0110000', '9': '1001000', 'A': '0011010',
};
function nw7Svg(num) {
  const text = 'A' + num + 'A', QUIET = 15, WIDE = 3, H = 60;  // Lề trắng 15 như ảnh mã trên trang 7-Eleven
  let x = QUIET, bars = '';
  [...text].forEach((ch, i) => {
    [...NW7[ch]].forEach((bit, j) => {
      const w = bit === '1' ? WIDE : 1;
      if (j % 2 === 0) bars += `<rect x="${x}" width="${w}" height="${H}"/>`;
      x += w;
    });
    if (i < text.length - 1) x += 1;  // khoảng nghỉ giữa 2 ký tự
  });
  return `<svg viewBox="0 0 ${x + QUIET} ${H}" preserveAspectRatio="none" shape-rendering="crispEdges" role="img"
              aria-label="Mã vạch ${num}"><g fill="#000">${bars}</g></svg>`;
}
const fmtSlip = n => n.length === 13 ? `${n.slice(0, 4)}-${n.slice(4, 9)}-${n.slice(9)}` : n;

let sheetSlip = null, sheetFromScan = false, wakeLock = null;
function showSheet(n, fromScan) {
  const o = data.orders.find(x => x.n === n);
  if (!o) return;
  sheetSlip = n;
  sheetFromScan = !!fromScan;
  // Mở từ máy quét -> bấm "Đã nhận" sẽ mở lại camera ngay cho thùng tiếp theo (nếu bật trong Cài đặt)
  $('sheetOk').textContent = sheetFromScan && settings.autoRescan ? 'Đã nhận · quét thùng tiếp' : 'Đã nhận · kiện tiếp theo';
  $('barcode').innerHTML = nw7Svg(n);
  $('sheetNum').textContent = fmtSlip(n);
  $('sheetAmount').textContent = o.a ? '¥' + o.a.toLocaleString('ja-JP') : '—';
  $('sheetMeta').innerHTML = `${esc(o.s)} · ${esc(o.ps)} · ${deadlineHtml(o)}`;
  $('sheetDone').hidden = !done[n];
  $('sheetDone').textContent = done[n] ? 'Kiện này đã đánh dấu nhận lúc ' + fmtTime(done[n]) : '';
  $('sheetLink').hidden = !o.u;
  $('sheetLink').href = o.u || '#';
  if (document.activeElement) document.activeElement.blur();
  $('sheet').hidden = false;
  document.body.classList.add('noscroll');
  // Giữ màn hình sáng trong lúc nhân viên quét (iOS 16.4+)
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {});
}
function closeSheet() {
  $('sheet').hidden = true;
  document.body.classList.remove('noscroll');
  sheetSlip = null;
  sheetFromScan = false;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
$('sheetOk').addEventListener('click', () => {
  const n = sheetSlip, rescan = sheetFromScan && settings.autoRescan;
  if (n && !done[n]) { done[n] = Date.now(); saveDone(); toast('Đã đánh dấu nhận ' + n.slice(-7), n); }
  closeSheet();
  $('q').value = '';
  render();
  if (rescan) openScanner(); else $('q').focus();
});
$('sheetClose').addEventListener('click', closeSheet);

// ---------- Cài đặt (lưu riêng trên máy này) ----------
let settings = readSettings();
function readSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(storage.get(KEY.settings) || '{}') }; } catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function setSetting(name, value) {
  settings[name] = value;
  storage.set(KEY.settings, JSON.stringify(settings));
  applySettings();
}
function applySettings() {
  $('barcode').className = $('sizePreview').className = 'barcode size-' + settings.size;
  document.querySelectorAll('[data-size]').forEach(b => b.classList.toggle('on', b.dataset.size === settings.size));
  $('optBeep').checked = settings.beep;
  $('optRescan').checked = settings.autoRescan;
  if (sheetSlip) $('sheetOk').textContent = sheetFromScan && settings.autoRescan ? 'Đã nhận · quét thùng tiếp' : 'Đã nhận · kiện tiếp theo';
}
function openSettings() {
  const sample = data && data.orders.length ? data.orders[0].n : '0000000000000';
  $('sizePreview').innerHTML = nw7Svg(sample);
  applySettings();
  $('settings').hidden = false;
  document.body.classList.add('noscroll');
}
function closeSettings() {
  $('settings').hidden = true;
  document.body.classList.remove('noscroll');
}
$('settingsBtn').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('optBeep').addEventListener('change', () => setSetting('beep', $('optBeep').checked));
$('optRescan').addEventListener('change', () => setSetting('autoRescan', $('optRescan').checked));
applySettings();

// ---------- Quét mã vạch trên thùng bằng camera (zxing-wasm: đọc mọi mã trong khung hình cùng lúc) ----------
const SCAN_OPTIONS = {
  formats: ['Codabar', 'Code128', 'Code39', 'ITF', 'EAN13', 'EAN8', 'UPCA', 'QRCode', 'DataMatrix'],
  tryHarder: true, tryRotate: true, tryInvert: false, maxNumberOfSymbols: 8,
};
const CAMERA_IDLE_MS = 90 * 1000;  // Giữ camera sẵn 90 giây sau khi đóng để lần quét sau mở ngay
const SCAN_LOG_MAX = 30;
let scanStream = null, scanning = false, scanGen = 0, cameraIdleTimer = null, audioCtx = null;
let torchOn = false, zoomed = false, aliasIndex = new Map();
const loggedThisSession = new Set();
const frameCanvas = document.createElement('canvas');
const frameCtx = frameCanvas.getContext('2d', { willReadFrequently: true });
const scanMsg = text => { $('scanMsg').textContent = text; };

function loadScanEngine() {
  if (window.ZXingWASM) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'vendor/zxing-wasm-3.1.5.js';
    s.onload = () => ZXingWASM.prepareZXingModule({
      overrides: { locateFile: (path, prefix) => path.endsWith('.wasm') ? 'vendor/zxing_reader-3.1.5.wasm' : prefix + path },
      fireImmediately: true,
    }).then(resolve, reject);
    s.onerror = () => reject(new Error('không tải được bộ quét'));
    document.head.appendChild(s);
  });
}

// Các số khác trong mail (số đơn, số vận đơn...) chỉ dùng khi số đó thuộc đúng 1 đơn
function buildAliasIndex() {
  const count = new Map();
  for (const o of data.orders) for (const a of o.x || []) count.set(a, (count.get(a) || 0) + 1);
  aliasIndex = new Map();
  for (const o of data.orders) for (const a of o.x || []) if (count.get(a) === 1) aliasIndex.set(a, o);
}

function findScanned(d) {
  if (d.length < 6) return null;
  const all = data.orders;
  const exact = all.find(o => o.n === d) || all.find(o => d.includes(o.n)) || aliasIndex.get(d);
  if (exact) return exact;
  for (const [a, o] of aliasIndex) if (a.length >= 10 && d.includes(a)) return o;
  const part = d.length >= 8 ? all.filter(o => o.n.includes(d)) : [];
  return part.length === 1 ? part[0] : null;
}

function readScanLog() {
  try { return JSON.parse(storage.get(KEY.scanlog) || '[]'); } catch (e) { return []; }
}
function logUnmatched(text, format) {
  if (loggedThisSession.has(text)) return;
  loggedThisSession.add(text);
  const log = readScanLog().filter(e => e.t !== text);
  log.unshift({ t: text, f: format, at: Date.now() });
  storage.set(KEY.scanlog, JSON.stringify(log.slice(0, SCAN_LOG_MAX)));
  showScanLog();
}
function showScanLog() {
  const log = readScanLog();
  $('scanLog').hidden = $('scanCopy').hidden = !log.length;
  $('scanLog').textContent = 'Mã đã đọc nhưng chưa khớp đơn:\n' + log.slice(0, 3).map(e => `${e.f}: ${e.t}`).join('\n');
}
$('scanCopy').addEventListener('click', async () => {
  const log = readScanLog();
  const text = log.map(e => `${e.f}: ${e.t}`).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    scanMsg(`Đã sao chép ${log.length} mã. Dán gửi lại để tìm cách ghép với đơn.`);
  } catch (e) {
    scanMsg(text);
  }
});

function drawMarks(marks, scale) {
  const video = $('scanVideo'), cv = $('scanMarks');
  const cw = cv.clientWidth, ch = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)) {
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cw, ch);
  if (!marks.length || !video.videoWidth) return;
  // Video hiển thị kiểu object-fit: cover -> đổi toạ độ khung hình sang toạ độ màn hình
  const k = Math.max(cw / video.videoWidth, ch / video.videoHeight);
  const ox = (cw - video.videoWidth * k) / 2, oy = (ch - video.videoHeight * k) / 2;
  g.lineWidth = 6;
  g.lineJoin = 'round';
  const COLORS = { ok: '#3fbf6f', done: '#5b9be6', none: '#f2b233' };
  for (const { r, state } of marks) {
    const p = r.position;
    g.beginPath();
    [p.topLeft, p.topRight, p.bottomRight, p.bottomLeft].forEach((pt, i) => {
      const x = pt.x / scale * k + ox, y = pt.y / scale * k + oy;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    });
    g.closePath();
    g.strokeStyle = COLORS[state];
    g.stroke();
  }
}

function beep() {
  if (!settings.beep) return;
  try {
    const osc = audioCtx.createOscillator();
    osc.frequency.value = 1500;
    osc.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  } catch (e) {}
}

// Trả về true nếu đã khớp 1 đơn (dừng quét)
function handleResults(results, scale) {
  const marks = [];
  let match = null, doneHit = null;
  for (const r of results) {
    if (!r.text) continue;
    const o = findScanned(digits(r.text));
    // Kiện đã nhận không mở lại (camera thường vẫn chĩa vào thùng vừa nhận khi quét tiếp)
    const state = !o ? 'none' : done[o.n] ? 'done' : 'ok';
    marks.push({ r, state });
    if (state === 'ok') match = match || o;
    else if (state === 'done') doneHit = doneHit || o;
    else logUnmatched(r.text, r.format);
  }
  drawMarks(marks, scale);
  if (match) { onMatch(match); return true; }
  if (doneHit) scanMsg(`Kiện ${fmtSlip(doneHit.n)} đã nhận lúc ${fmtTime(done[doneHit.n])} (khung xanh dương).\nĐưa camera sang thùng khác.`);
  else if (marks.length) scanMsg(`Thấy ${marks.length} mã nhưng chưa khớp đơn nào (khung vàng). Thử mã khác trên thùng.`);
  return false;
}

function onMatch(o) {
  beep();
  closeScanner();
  if (o.s !== view.store) { view.store = o.s; storage.set(KEY.store, o.s); }
  $('q').value = o.n;
  render();
  showSheet(o.n, true);
}

async function scanLoop(gen) {
  const video = $('scanVideo');
  while (scanning && gen === scanGen) {
    if (video.readyState >= 2 && video.videoWidth) {
      const scale = Math.min(1, 1920 / Math.max(video.videoWidth, video.videoHeight));
      const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
      if (frameCanvas.width !== w || frameCanvas.height !== h) { frameCanvas.width = w; frameCanvas.height = h; }
      frameCtx.drawImage(video, 0, 0, w, h);
      let results = [];
      try { results = await ZXingWASM.readBarcodes(frameCtx.getImageData(0, 0, w, h), SCAN_OPTIONS); } catch (e) {}
      if (!scanning || gen !== scanGen) break;
      if (handleResults(results, scale)) break;
    }
    await new Promise(r => requestAnimationFrame(r));
  }
}

async function startCamera() {
  if (scanStream && scanStream.getVideoTracks().some(t => t.readyState === 'live')) return;
  scanStream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
  });
  $('scanVideo').srcObject = scanStream;
  const track = scanStream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  torchOn = zoomed = false;
  $('torchBtn').hidden = !caps.torch;
  $('zoomBtn').hidden = !(caps.zoom && caps.zoom.max >= 1.5);
  $('torchBtn').textContent = 'Đèn: tắt';
  $('zoomBtn').textContent = 'Phóng to';
}

function stopCamera() {
  clearTimeout(cameraIdleTimer);
  if (scanStream) scanStream.getTracks().forEach(t => t.stop());
  scanStream = null;
  $('scanVideo').srcObject = null;
}

function applyTrack(constraint) {
  const track = scanStream && scanStream.getVideoTracks()[0];
  if (track) track.applyConstraints({ advanced: [constraint] }).catch(() => {});
  return track;
}
$('torchBtn').addEventListener('click', () => {
  torchOn = !torchOn;
  applyTrack({ torch: torchOn });
  $('torchBtn').textContent = torchOn ? 'Đèn: bật' : 'Đèn: tắt';
});
$('zoomBtn').addEventListener('click', () => {
  const track = scanStream && scanStream.getVideoTracks()[0];
  if (!track) return;
  const z = track.getCapabilities().zoom;
  zoomed = !zoomed;
  applyTrack({ zoom: zoomed ? Math.min(2, z.max) : Math.max(1, z.min) });
  $('zoomBtn').textContent = zoomed ? 'Thu nhỏ' : 'Phóng to';
});

async function openScanner() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  if (document.activeElement) document.activeElement.blur();
  clearTimeout(cameraIdleTimer);
  const gen = ++scanGen;
  $('scanner').hidden = false;
  document.body.classList.add('noscroll');
  drawMarks([], 1);
  showScanLog();
  scanMsg('Đang mở camera…');
  try {
    await Promise.all([loadScanEngine(), startCamera()]);
    if (gen !== scanGen) return;  // Đã bấm Đóng trong lúc chờ
    await $('scanVideo').play().catch(() => {});
    scanMsg('Chĩa camera vào nhãn trên thùng, app đọc mọi mã vạch trong khung hình.');
    scanning = true;
    scanLoop(gen);
  } catch (err) {
    scanMsg(err && err.name === 'NotAllowedError'
      ? 'Chưa được phép dùng camera.\nBấm Đóng rồi bấm nút quét lại và chọn "Cho phép". Nếu không hỏi nữa: Cài đặt > Safari > Camera > Hỏi.'
      : 'Không mở được camera: ' + (err && (err.message || err.name) || err));
  }
}

function closeScanner() {
  scanning = false;
  scanGen++;
  $('scanner').hidden = true;
  document.body.classList.remove('noscroll');
  clearTimeout(cameraIdleTimer);
  cameraIdleTimer = setTimeout(stopCamera, CAMERA_IDLE_MS);
}
$('scanBtn').addEventListener('click', openScanner);
$('scanClose').addEventListener('click', closeScanner);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  if (!$('scanner').hidden) closeScanner();
  stopCamera();
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('scanner').hidden) closeScanner();
  else if (!$('sheet').hidden) closeSheet();
  else if (!$('settings').hidden) closeSettings();
});

document.addEventListener('click', ev => {
  const show = ev.target.closest('[data-show]');
  if (show) {
    showSheet(show.dataset.show);
    return;
  }
  const size = ev.target.closest('[data-size]');
  if (size) {
    setSetting('size', size.dataset.size);
    return;
  }
  const toggle = ev.target.closest('[data-toggle]');
  if (toggle) {
    const n = toggle.dataset.toggle;
    if (done[n]) delete done[n]; else done[n] = Date.now();
    saveDone(); render();
    return;
  }
  const chip = ev.target.closest('[data-store]');
  if (chip) {
    view.store = chip.dataset.store; storage.set(KEY.store, view.store);
    render();
    return;
  }
  const seg = ev.target.closest('[data-filter]');
  if (seg) {
    view.filter = seg.dataset.filter;
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === seg));
    render();
  }
});

$('q').addEventListener('input', () => { render(); window.scrollTo(0, 0); });
$('clearQ').addEventListener('click', () => { $('q').value = ''; render(); $('q').focus(); });
$('prod').addEventListener('change', () => { view.prod = $('prod').value; render(); });
$('reloadBtn').addEventListener('click', () => reload(false));
$('lockBtn').addEventListener('click', () => {
  cryptoKey = null; data = null; storage.del(KEY.key);
  showLock('');
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && cryptoKey && Date.now() - lastFetch > RELOAD_AFTER_MS) reload(true);
});

start();
</script>
</body>
</html>
